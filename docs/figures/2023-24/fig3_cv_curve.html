<html>
<head><style>html,body{margin:0;height:100%}
.js-plotly-plot,.plotly-graph-div{height:auto!important}
@media (prefers-color-scheme: dark){
  body:not(.fam-light){background:#1a1a19;color:#c3c2b7}
  body:not(.fam-light) .controls button{background:#1a1a19;color:#c3c2b7;border-color:#383835}
  body:not(.fam-light) .controls button.on{background:#3987e5;color:#0f0e0d;border-color:#3987e5}
  body:not(.fam-light) .seasonlab{color:#f5f3ec}
}
body.fam-dark{background:#1a1a19;color:#c3c2b7}

body.fam-dark .controls button.on{background:#3987e5;color:#0f0e0d;border-color:#3987e5}
body.fam-dark .seasonlab{color:#f5f3ec}</style><meta charset="utf-8" /></head>
<body>
    <div style="height:auto; width:100%;">                        <script>window.PlotlyConfig = {MathJaxConfig: 'local'};</script>
        <script>/* famplot — the family's SVG chart engine.
 *
 * Implements the subset of the Plotly API that the studies' figures use
 * (newPlot / react / relayout / Plots.resize) and renders them as hand-drawn
 * SVG in the family chart style: thin marks, 4px rounded data-ends, hairline
 * grids, surface gaps, a dark-chip tooltip, selective direct labels via the
 * spec's own annotations. Trace types: scatter (lines / markers / bands /
 * dashed), bar (vertical, horizontal, grouped), histogram. Anything colors:
 * whatever hexes the spec carries (the page runtime darkens them for dark
 * scheme before calling react).
 *
 * The interactive plotly originals remain available by running each study's
 * figure scripts on GitHub (python/0*.py -> figures/*.html).
 */
(function () {
  "use strict";

  var NS = "http://www.w3.org/2000/svg";

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  /* plotly's write_html packs numeric arrays as {dtype, bdata(, shape)} —
   * decode them back to plain arrays so the renderer sees numbers. */
  var DTYPES = { f8: Float64Array, f4: Float32Array, i4: Int32Array,
                 i2: Int16Array, i1: Int8Array, u4: Uint32Array,
                 u2: Uint16Array, u1: Uint8Array };
  function decode(v) {
    if (!v || typeof v !== "object" || Array.isArray(v) || !v.bdata) return v;
    var T = DTYPES[v.dtype] || Float64Array;
    var bin = atob(v.bdata);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var flat = Array.prototype.slice.call(new T(bytes.buffer));
    var shape = v.shape && String(v.shape).split(",").map(Number);
    if (shape && shape.length === 2) {
      var rows = [];
      for (var r = 0; r < shape[0]; r++) {
        rows.push(flat.slice(r * shape[1], (r + 1) * shape[1]));
      }
      return rows;
    }
    return flat;
  }
  function decodeTrace(tr) {
    ["x", "y", "customdata"].forEach(function (k) {
      if (tr[k] != null) tr[k] = decode(tr[k]);
    });
    if (tr.marker) {
      ["color", "size", "opacity"].forEach(function (k) {
        if (tr.marker[k] != null) tr.marker[k] = decode(tr.marker[k]);
      });
    }
    ["error_x", "error_y"].forEach(function (k) {
      var e = tr[k];
      if (!e) return;
      ["array", "arrayminus"].forEach(function (a) {
        if (e[a] != null) e[a] = decode(e[a]);
      });
    });
    return tr;
  }

  /* Traces without explicit colors take the family categorical order,
   * assigned by trace index (never re-cycled). Spec-carried colors are
   * darkened by the page runtime; these engine-side fallbacks pick the
   * dark steps themselves by checking the theme stamped on the body. */
  var FAMILY_WAY = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100",
                    "#e87ba4", "#008300", "#4a3aa7", "#e34948"];
  var FAMILY_WAY_DARK = ["#3987e5", "#d95926", "#199e70", "#c98500",
                         "#d55181", "#008300", "#9085e9", "#e66767"];
  function isDarkDoc() {
    var b = document.body;
    if (b && b.classList.contains("fam-dark")) return true;
    if (b && b.classList.contains("fam-light")) return false;
    return window.matchMedia &&
      matchMedia("(prefers-color-scheme: dark)").matches;
  }

  /* Numeric marker colors map through the trace's colorscale. */
  function hexToRgb(h) {
    if (h[0] !== "#") return [128, 128, 128];
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16),
            parseInt(h.slice(5, 7), 16)];
  }
  function scaleColor(scale, t) {
    for (var i = 1; i < scale.length; i++) {
      if (t <= scale[i][0]) {
        var a = scale[i - 1], b = scale[i];
        var f = (t - a[0]) / ((b[0] - a[0]) || 1);
        var ca = hexToRgb(a[1]), cb = hexToRgb(b[1]);
        return "rgb(" + ca.map(function (v, j) {
          return Math.round(v + (cb[j] - v) * f);
        }).join(",") + ")";
      }
    }
    return scale[scale.length - 1][1];
  }

  function stripTags(s) {
    return String(s == null ? "" : s)
      .replace(/<br\s*\/?>/gi, "\n")
      .replace(/<[^>]+>/g, "")
      .replace(/&#8220;|&#8221;/g, '"')
      .replace(/&#8216;|&#8217;/g, "'")
      .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&nbsp;/g, " ");
  }

  /* ---- d3-format-lite: the specifiers the figures actually use ---- */
  function fmt(spec, v) {
    if (v == null || typeof v !== "number" || !isFinite(v)) return String(v);
    if (!spec) {
      return String(Math.round(v * 1000) / 1000);
    }
    var plus = spec.indexOf("+") >= 0;
    var comma = spec.indexOf(",") >= 0;
    var m = spec.match(/\.(\d+)([f%])/);
    var out;
    if (m && m[2] === "%") {
      out = (v * 100).toFixed(+m[1]) + "%";
    } else if (m) {
      out = v.toFixed(+m[1]);
      if (comma) out = commas(out);
    } else if (comma) {
      out = commas(String(Math.round(v)));
    } else {
      out = String(v);
    }
    if (plus && v > 0) out = "+" + out;
    return out;
  }
  function commas(s) {
    var p = s.split(".");
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return p.join(".");
  }

  /* Fill a hovertemplate for point i of trace tr. */
  function hover(tr, i, xv, yv) {
    var t = tr.hovertemplate;
    if (!t) {
      var name = tr.name ? tr.name + ": " : "";
      return name + fmtVal(xv) + ", " + fmtVal(yv);
    }
    t = t.replace(/<extra>.*?<\/extra>/g, "");
    t = t.replace(/%\{([^}]+)\}/g, function (_, expr) {
      var parts = expr.split(":");
      var path = parts[0], f = parts.slice(1).join(":");
      var val;
      if (path === "x") val = xv;
      else if (path === "y") val = yv;
      else if (path === "customdata") {
        /* A 1-D customdata (one value per point) is referenced whole. */
        var cd = tr.customdata ? tr.customdata[i] : "";
        val = Array.isArray(cd) ? cd.join(", ") : (cd == null ? "" : cd);
      }
      else if (path.indexOf("customdata[") === 0) {
        var idx = +path.slice(11, -1);
        val = tr.customdata && tr.customdata[i] ? tr.customdata[i][idx] : "";
      } else if (path === "text" || path === "hovertext") {
        /* Scatter traces carry the point's label in `text` and lead their
         * template with it ("%{text}<br>xPPS %{x}"). Without this branch it
         * resolved to "" and every tooltip lost the player's name. */
        var src = path === "text" ? tr.text : (tr.hovertext || tr.text);
        val = Array.isArray(src) ? (src[i] == null ? "" : src[i])
          : (src == null ? "" : src);
      } else if (path === "fullData.name") val = tr.name || "";
      else val = "";
      return typeof val === "number" ? fmt(f, val) : String(val);
    });
    return stripTags(t);
  }
  function fmtVal(v) {
    return typeof v === "number" ? fmt(null, v) : String(v);
  }

  /* Tick labels formatted at the spec's precision can collide (".0%" ticks
   * every half point read 3%, 3%, 2%, 2%). Add decimals until they differ. */
  function fmtTicks(spec, vals) {
    var labs = vals.map(function (v) { return fmt(spec, v); });
    var m = spec && spec.match(/\.(\d+)([f%])/);
    for (var extra = 1; m && extra <= 2; extra++) {
      var uniq = labs.filter(function (s, i) { return labs.indexOf(s) === i; });
      if (uniq.length === labs.length) break;
      var s2 = spec.replace(/\.(\d+)([f%])/, "." + (+m[1] + extra) + "$2");
      labs = vals.map(function (v) { return fmt(s2, v); });
    }
    return labs;
  }

  /* ---- text measurement and wrapping ----
   * Layout decisions (wrapping, truncation, margins) use the rendered width
   * of the text, with a per-character estimate when the document cannot
   * measure (not yet laid out). */
  var measureNode = null;
  function textW(s, size, weight) {
    s = String(s == null ? "" : s);
    if (!s) return 0;
    var w = 0;
    try {
      if (measureNode && measureNode.ownerSVGElement &&
          measureNode.ownerSVGElement.isConnected) {
        measureNode.setAttribute("font-size", size + "px");
        measureNode.setAttribute("font-weight", weight || "400");
        measureNode.textContent = s;
        w = measureNode.getComputedTextLength();
      }
    } catch (e) { w = 0; }
    return w > 0 ? w : s.length * size * 0.56;
  }
  function wrapWords(text, maxW, size, weight) {
    var out = [];
    String(text).split("\n").forEach(function (para) {
      var line = "";
      para.split(" ").forEach(function (word) {
        var cand = line ? line + " " + word : word;
        if (line && textW(cand, size, weight) > maxW) {
          out.push(line); line = word;
        } else {
          line = cand;
        }
      });
      if (line) out.push(line);
    });
    return out.length ? out : [""];
  }
  function fitText(s, maxW, size, weight) {
    s = String(s);
    if (textW(s, size, weight) <= maxW) return s;
    while (s.length > 1 && textW(s + "…", size, weight) > maxW) {
      s = s.slice(0, -1);
    }
    return s.replace(/\s+$/, "") + "…";
  }

  /* ---- scales ---- */
  function linScale(d0, d1, r0, r1) {
    var f = function (v) { return r0 + (v - d0) / (d1 - d0 || 1) * (r1 - r0); };
    f.d0 = d0; f.d1 = d1;
    return f;
  }
  /* A log axis carries its domain in log10 units (plotly's convention for
   * `range` on `type:"log"`) while the data stays in linear units, so the
   * scale takes the log here rather than at every call site. */
  function log10(v) { return Math.log(v) / Math.LN10; }
  function logScale(d0, d1, r0, r1) {
    var f = function (v) {
      if (!(v > 0)) return NaN;
      return r0 + (log10(v) - d0) / (d1 - d0 || 1) * (r1 - r0);
    };
    f.d0 = d0; f.d1 = d1;
    return f;
  }
  /* Decade ticks, subdivided when the span is short enough to read. Values
   * come back in data units so the existing formatter labels them 100,
   * 1,000 rather than 2, 3. */
  function logTicks(d0, d1) {
    var lo = Math.floor(Math.min(d0, d1)), hi = Math.ceil(Math.max(d0, d1));
    var decades = hi - lo;
    var mant = decades <= 1 ? [1, 2, 3, 5, 7]
      : decades <= 4 ? [1, 2, 5] : [1];
    var out = [];
    for (var e = lo; e <= hi; e++) {
      for (var i = 0; i < mant.length; i++) {
        var v = mant[i] * Math.pow(10, e);
        var l = log10(v);
        if (l >= Math.min(d0, d1) - 1e-9 && l <= Math.max(d0, d1) + 1e-9) {
          out.push(v);
        }
      }
    }
    return out;
  }
  function niceTicks(d0, d1, n) {
    var span = d1 - d0 || 1;
    var step = Math.pow(10, Math.floor(Math.log(span / n) / Math.LN10));
    var err = span / n / step;
    if (err >= 7.5) step *= 10; else if (err >= 3.5) step *= 5;
    else if (err >= 1.5) step *= 2;
    var ticks = [];
    for (var v = Math.ceil(d0 / step) * step; v <= d1 + step / 1e6; v += step) {
      ticks.push(Math.abs(v) < step / 1e6 ? 0 : Math.round(v * 1e9) / 1e9);
    }
    return ticks;
  }

  /* ---- histogram binning ---- */
  function binHistogram(tr) {
    var xs = tr.x.filter(function (v) { return v != null; });
    var lo = Math.min.apply(null, xs), hi = Math.max.apply(null, xs);
    var n = tr.nbinsx || Math.ceil(Math.sqrt(xs.length));
    var step = (hi - lo) / n || 1;
    var counts = new Array(n).fill(0);
    xs.forEach(function (v) {
      var b = Math.min(n - 1, Math.floor((v - lo) / step));
      counts[b] += 1;
    });
    var total = xs.length;
    return counts.map(function (c, i) {
      return { x: lo + (i + 0.5) * step, w: step,
               y: tr.histnorm === "probability" ? c / total : c };
    });
  }

  /* ---- tooltip (one per document) ---- */
  var tip = null;
  function ensureTip() {
    if (tip) return tip;
    tip = document.createElement("div");
    tip.className = "famplot-tip";
    var st = document.createElement("style");
    st.textContent =
      ".famplot-tip{position:fixed;z-index:30;pointer-events:none;" +
      "background:#262521;color:#f5f3ec;border-radius:6px;" +
      "padding:.4rem .6rem;font:12.5px/1.45 system-ui,-apple-system," +
      "'Segoe UI',sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.28);" +
      "opacity:0;max-width:260px;white-space:pre-line}" +
      ".famplot-tip.on{opacity:1}" +
      "body.fam-dark .famplot-tip{background:#f5f3ec;color:#161512}";
    document.head.appendChild(st);
    document.body.appendChild(tip);
    return tip;
  }
  function showTip(evt, text) {
    var t = ensureTip();
    t.textContent = text;
    t.classList.add("on");
    var pad = 12;
    var x = evt.clientX + pad, y = evt.clientY + pad;
    var r = t.getBoundingClientRect();
    if (x + r.width > innerWidth - 6) x = evt.clientX - r.width - pad;
    if (y + r.height > innerHeight - 6) y = evt.clientY - r.height - pad;
    t.style.left = x + "px"; t.style.top = y + "px";
  }
  function hideTip() { if (tip) tip.classList.remove("on"); }

  /* Tell the embedding page how tall this figure really is (the chart's
   * height depends on the frame's width, and controls can sit above it), so
   * the frame fits it instead of clipping or leaving a gap. */
  var heightTimer = null;
  function postHeight() {
    if (window.parent === window) return;
    clearTimeout(heightTimer);
    heightTimer = setTimeout(function () {
      var bottom = 0;
      Array.prototype.forEach.call(document.querySelectorAll("svg"),
        function (s) {
          var r = s.getBoundingClientRect();
          bottom = Math.max(bottom, r.bottom + (window.scrollY || 0));
        });
      if (bottom > 0) {
        try { window.parent.postMessage({ famHeight: Math.ceil(bottom) }, "*"); }
        catch (e) {}
      }
    }, 30);
  }

  /* ---- the renderer ---- */
  function render(gd) {
    var data = gd.data || [], layout = gd.layout || {};
    gd.textContent = "";
    var W = gd.clientWidth || layout.width || 700;
    var H = layout.height || 480;
    var mobile = W < 640;
    // Category-row charts keep their height (rows must stay readable);
    // x-y charts scale down with the viewport.
    var hasHBars = data.some(function (tr) {
      return tr.type === "bar" && tr.orientation === "h" &&
        tr.visible !== false;
    });
    if (W < 560 && !hasHBars) H = Math.max(300, Math.round(H * (W / 560)));
    var mg = layout.margin || {};
    var M = { l: mg.l != null ? mg.l : 60, r: mg.r != null ? mg.r : 30,
              t: mg.t != null ? mg.t : 60, b: mg.b != null ? mg.b : 50 };
    if (W < 700 && M.r > 40) M.r = 24;
    if (mobile && M.l > 108) M.l = 108;
    var fontCol = (layout.font && layout.font.color) || "#52514e";
    var titleCol = (layout.title && layout.title.font &&
                    layout.title.font.color) || fontCol;
    var XA = layout.xaxis || {}, YA = layout.yaxis || {};
    var grid = XA.gridcolor || YA.gridcolor || "#e1e0d9";
    var axline = XA.linecolor || YA.linecolor || "#c3c2b7";

    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, width: "100%",
                          role: "img" }, gd);
    svg.style.display = "block";
    svg.style.fontFamily = (layout.font && layout.font.family) ||
      "system-ui, -apple-system, 'Segoe UI', sans-serif";
    var bgRect = el("rect", { x: 0, y: 0, width: W, height: H,
                 fill: layout.paper_bgcolor || "#fcfcfb" }, svg);
    measureNode = el("text", { x: -9999, y: -9999, "aria-hidden": "true" },
                     svg);

    /* title: wrap to the actual width so narrow screens never clip it. The
     * first paragraph is the title (bold on every wrapped line); a <br>
     * starts the subtitle, set regular. */
    var titleText = stripTags(layout.title && layout.title.text);
    var titleEnd = 4;
    if (titleText) {
      var tfs = mobile ? 13.5 : 15;
      var tl = [];
      titleText.split("\n").forEach(function (para, pi) {
        wrapWords(para, W - M.l - 12, tfs, pi === 0 ? "600" : "400")
          .forEach(function (s) { tl.push({ s: s, sub: pi > 0 }); });
      });
      tl.forEach(function (ln, i) {
        var tt = el("text", { x: M.l, y: 22 + i * (tfs + 4),
          fill: ln.sub ? fontCol : titleCol, "font-size": tfs + "px",
          "font-weight": ln.sub ? "400" : "600" }, svg);
        tt.textContent = ln.s;
      });
      titleEnd = 22 + (tl.length - 1) * (tfs + 4) + 6;
      var needT = 30 + tl.length * (tfs + 4);
      if (M.t < needT) M.t = needT;
    }

    /* ---- assemble series geometry ---- */
    var tIdx = new Map();
    data.forEach(function (tr, i) { tIdx.set(tr, i); });
    function traceColor(tr) {
      if (tr.line && tr.line.color) return tr.line.color;
      if (tr.marker && typeof tr.marker.color === "string") {
        return tr.marker.color;
      }
      var way = isDarkDoc() ? FAMILY_WAY_DARK : FAMILY_WAY;
      return way[(tIdx.get(tr) || 0) % way.length];
    }
    /* Per-bar literal colors (an earlier/exposed split, a highlight). */
    function barColor(tr, i) {
      var mc = tr.marker && tr.marker.color;
      if (Array.isArray(mc) && typeof mc[i] === "string") return mc[i];
      return traceColor(tr);
    }
    var bars = [], hbars = [], lines = [], points = [], bands = [];
    var catX = XA.type === "category";
    var catY = YA.type === "category";
    var xCats = [], yCats = [];
    var prevScatter = null;
    data.forEach(function (tr) {
      if (tr.visible === false) return;
      var type = tr.type || "scatter";
      if (type === "histogram") {
        binHistogram(tr).forEach(function (b) {
          bars.push({ tr: tr, x: b.x, y: b.y, w: b.w, i: -1 });
        });
      } else if (type === "bar" && tr.orientation === "h") {
        (tr.y || []).forEach(function (yv, i) {
          yCats.indexOf(yv) < 0 && yCats.push(yv);
          hbars.push({ tr: tr, cat: yv, v: tr.x[i], i: i });
        });
      } else if (type === "bar") {
        (tr.x || []).forEach(function (xv, i) {
          if (catX || typeof xv === "string") {
            xCats.indexOf(xv) < 0 && xCats.push(xv);
          }
          bars.push({ tr: tr, x: xv, y: tr.y[i], i: i });
        });
      } else { /* scatter */
        var mode = tr.mode || "lines";
        if (tr.fill === "toself") {
          bands.push({ tr: tr, xs: tr.x, ys: tr.y });
        } else if (tr.fill === "tonexty") {
          /* plotly fills to the previous scatter trace (a percentile band
           * is drawn as lower bound, then upper bound with tonexty); only
           * the first trace has nothing before it and fills to the axis. */
          bands.push({ tr: tr, xs: tr.x, ys: tr.y, tonext: true,
                       prev: prevScatter });
          if (mode.indexOf("lines") >= 0 &&
              !(tr.line && tr.line.width === 0)) lines.push(tr);
        } else {
          if (mode.indexOf("lines") >= 0) lines.push(tr);
          if (mode.indexOf("markers") >= 0) {
            (tr.x || []).forEach(function (xv, i) {
              if (catX || typeof xv === "string") {
                xCats.indexOf(xv) < 0 && xCats.push(xv);
              }
              /* A dot plot against named rows (players, teams) arrives as a
               * scatter whose y values are strings; band them like the
               * horizontal-bar path rather than scaling them as numbers. */
              var yv = tr.y ? tr.y[i] : null;
              if (catY || typeof yv === "string") {
                yCats.indexOf(yv) < 0 && yCats.push(yv);
              }
              points.push({ tr: tr, x: xv, y: yv, i: i });
            });
          }
        }
        prevScatter = tr;
      }
    });
    var barTraces = [];
    data.forEach(function (tr) {
      if ((tr.type === "bar" || tr.type === "histogram") &&
          barTraces.indexOf(tr) < 0) barTraces.push(tr);
    });

    /* ---- domains ---- */
    function extent(vals, pad, zero) {
      var lo = Infinity, hi = -Infinity;
      vals.forEach(function (v) {
        if (typeof v === "number" && isFinite(v)) {
          if (v < lo) lo = v; if (v > hi) hi = v;
        }
      });
      if (lo === Infinity) { lo = 0; hi = 1; }
      if (zero && lo > 0) lo = 0;
      if (zero && hi < 0) hi = 0;
      var span = (hi - lo) || Math.abs(hi) || 1;
      return [lo - (zero && lo === 0 ? 0 : span * pad), hi + span * pad];
    }
    var xs = [], ys = [];
    bands.forEach(function (b) { xs = xs.concat(b.xs); ys = ys.concat(b.ys); });
    lines.forEach(function (tr) { xs = xs.concat(tr.x); ys = ys.concat(tr.y); });
    /* Error bars widen the axis they run along: a CI whisker that reaches
     * past the last dot must still land inside the plotting surface. */
    function errSpan(tr, key, v, i) {
      var e = tr[key];
      if (!e || e.visible === false ||
          typeof v !== "number" || !isFinite(v)) return [v];
      var plus = Array.isArray(e.array) ? e.array[i] : e.array;
