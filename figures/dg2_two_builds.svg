<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 604.9" role="img" aria-label="Two independent builds of player value and where they meet"><title>Two independent builds of player value and where they meet</title><defs><marker id="dg-arrow-86ea20a3b7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="26" font-size="18" class="dg-f-nba dg-display" font-weight="700">Lineup model</text><rect x="12" y="42" width="348" height="70.5" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="24" y="62" font-size="14" class="dg-f-ink3 dg-text" font-weight="700">SOURCE</text><text x="24" y="83" font-size="15" class="dg-f-ink dg-text">the NBA&#x27;s season lineup totals</text><text x="24" y="103.25" font-size="15" class="dg-f-ink dg-text">(stats.nba.com)</text><line x1="186" y1="114.5" x2="186" y2="128.5" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-86ea20a3b7)"/><rect x="12" y="130.5" width="348" height="50.25" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="24" y="150.5" font-size="14" class="dg-f-ink3 dg-text" font-weight="700">UNIT</text><text x="24" y="171.5" font-size="15" class="dg-f-ink dg-text">15,901 five-man lineups</text><line x1="186" y1="182.75" x2="186" y2="196.75" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-86ea20a3b7)"/><rect x="12" y="198.75" width="348" height="90.75" class="dg-f-surface2 dg-s-c3" rx="6" stroke-width="1.5"/><text x="24" y="218.75" font-size="14" class="dg-f-c3 dg-text" font-weight="700">AUDIT</text><text x="24" y="239.75" font-size="15" class="dg-f-ink dg-text">lineup plus-minus re-adds to every</text><text x="24" y="260" font-size="15" class="dg-f-ink dg-text">team&#x27;s season total (largest miss: 0</text><text x="24" y="280.25" font-size="15" class="dg-f-ink dg-text">points)</text><line x1="186" y1="291.5" x2="186" y2="305.5" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-86ea20a3b7)"/><rect x="12" y="307.5" width="348" height="50.25" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="24" y="327.5" font-size="14" class="dg-f-ink3 dg-text" font-weight="700">MODEL</text><text x="24" y="348.5" font-size="15" class="dg-f-ink dg-text">ridge on each lineup&#x27;s five players</text><line x1="186" y1="359.75" x2="186" y2="373.75" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-86ea20a3b7)"/><rect x="12" y="375.75" width="348" height="50.25" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="24" y="395.75" font-size="14" class="dg-f-ink3 dg-text" font-weight="700">RESULT</text><text x="24" y="416.75" font-size="15" class="dg-f-ink dg-text" font-weight="700">454 player values</text><text x="400" y="26" font-size="18" class="dg-f-nba dg-display" font-weight="700">Stint model</text><rect x="400" y="42" width="348" height="70.5" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="412" y="62" font-size="14" class="dg-f-ink3 dg-text" font-weight="700">SOURCE</text><text x="412" y="83" font-size="15" class="dg-f-ink dg-text">the season&#x27;s play-by-play, event by</text><text x="412" y="103.25" font-size="15" class="dg-f-ink dg-text">event</text><line x1="574" y1="114.5" x2="574" y2="128.5" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-86ea20a3b7)"/><rect x="400" y="130.5" width="348" height="50.25" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="412" y="150.5" font-size="14" class="dg-f-ink3 dg-text" font-weight="700">UNIT</text><text x="412" y="171.5" font-size="15" class="dg-f-ink dg-text">62,658 stints from 1,230 games</text><line x1="574" y1="182.75" x2="574" y2="196.75" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-86ea20a3b7)"/><rect x="400" y="198.75" width="348" height="70.5" class="dg-f-surface2 dg-s-c3" rx="6" stroke-width="1.5"/><text x="412" y="218.75" font-size="14" class="dg-f-c3 dg-text" font-weight="700">AUDIT</text><text x="412" y="239.75" font-size="15" class="dg-f-ink dg-text">plus-minus matches the NBA&#x27;s own feed</text><text x="412" y="260" font-size="15" class="dg-f-ink dg-text">in 99.8% of player-games</text><line x1="574" y1="271.25" x2="574" y2="285.25" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-86ea20a3b7)"/><rect x="400" y="287.25" width="348" height="50.25" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="412" y="307.25" font-size="14" class="dg-f-ink3 dg-text" font-weight="700">MODEL</text><text x="412" y="328.25" font-size="15" class="dg-f-ink dg-text">ridge on both fives, with opponents</text><line x1="574" y1="339.5" x2="574" y2="353.5" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-86ea20a3b7)"/><rect x="400" y="355.5" width="348" height="70.5" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="412" y="375.5" font-size="14" class="dg-f-ink3 dg-text" font-weight="700">RESULT</text><text x="412" y="396.5" font-size="15" class="dg-f-ink dg-text" font-weight="700">452 player values, and home court worth</text><text x="412" y="416.75" font-size="15" class="dg-f-ink dg-text" font-weight="700">+2.2 per 100 as a byproduct</text><line x1="186" y1="428" x2="350" y2="462" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-86ea20a3b7)"/><line x1="574" y1="428" x2="410" y2="462" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-86ea20a3b7)"/><rect x="150" y="466" width="460" height="76" class="dg-f-surface2 dg-s-nba" rx="8" stroke-width="2"/><text x="164" y="490" font-size="14" class="dg-f-nba dg-text" font-weight="700">WHERE THEY MEET</text><text x="164" y="511.75" font-size="15" class="dg-f-ink dg-text">452 players are in both. Ranked by each model, their</text><text x="164" y="532" font-size="15" class="dg-f-ink dg-text">orders agree with a Spearman correlation of 0.97.</text><text x="12" y="572" font-size="14" class="dg-f-ink2 dg-text">No code path and no data feed is shared between the two columns, so their agreement is evidence</text><text x="12" y="590.9" font-size="14" class="dg-f-ink2 dg-text">about the players, not the plumbing.</text></svg>
