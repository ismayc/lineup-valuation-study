<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 928.15" role="img" aria-label="How each model turns basketball into one row of a regression"><title>How each model turns basketball into one row of a regression</title><defs><marker id="dg-arrow-2388f64144" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><rect x="12" y="14" width="336" height="333.95" rx="8" stroke-width="1.5" class="dg-f-surface2 dg-s-rule"/><rect x="12" y="365.95" width="336" height="359.75" rx="8" stroke-width="1.5" class="dg-f-surface2 dg-s-rule"/><text x="24" y="42" font-size="17" class="dg-f-nba dg-display" font-weight="700">Lineup model</text><text x="24" y="64" font-size="12" class="dg-f-ink2 dg-text">One row per five-man lineup, summed over the</text><text x="24" y="80.2" font-size="12" class="dg-f-ink2 dg-text">season</text><text x="24" y="110.2" font-size="13" class="dg-f-ink dg-text" font-weight="700">MIL&#x27;s best high-volume lineup</text><text x="26" y="131" font-size="13" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="58" y="131" font-size="13" class="dg-f-ink dg-text">Brook Lopez</text><text x="26" y="149.85" font-size="13" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="58" y="149.85" font-size="13" class="dg-f-ink dg-text">Damian Lillard</text><text x="26" y="168.7" font-size="13" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="58" y="168.7" font-size="13" class="dg-f-ink dg-text">Khris Middleton</text><text x="26" y="187.55" font-size="13" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="58" y="187.55" font-size="13" class="dg-f-ink dg-text">Giannis Antetokounmpo</text><text x="26" y="206.4" font-size="13" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="58" y="206.4" font-size="13" class="dg-f-ink dg-text">Malik Beasley</text><text x="26" y="225.25" font-size="13" class="dg-f-ink3 dg-text" font-weight="700">0</text><text x="58" y="225.25" font-size="13" class="dg-f-ink3 dg-text">every other player</text><text x="24" y="251.25" font-size="13" class="dg-f-ink dg-text">Outcome: +199 over 1,302 possessions =</text><text x="24" y="268.8" font-size="13" class="dg-f-ink dg-text">+15.3 per 100</text><text x="24" y="287.65" font-size="13" class="dg-f-ink2 dg-text">Weight: 1,302 possessions</text><text x="24" y="309.75" font-size="12" class="dg-f-c8 dg-text" font-style="italic">Opponents: not in the season totals, so not</text><text x="24" y="325.95" font-size="12" class="dg-f-c8 dg-text" font-style="italic">adjusted for</text><text x="24" y="393.95" font-size="17" class="dg-f-nba dg-display" font-weight="700">Stint model</text><text x="24" y="415.95" font-size="12" class="dg-f-ink2 dg-text">One row per stint: no substitution by either</text><text x="24" y="432.15" font-size="12" class="dg-f-ink2 dg-text">team</text><text x="24" y="462.15" font-size="12" class="dg-f-ink dg-text" font-weight="700">IND at MIL, fourth quarter, 7:33 to 0:00</text><text x="24" y="482.95" font-size="12" class="dg-f-ink2 dg-text">MIL (home)</text><text x="26" y="500.95" font-size="13" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="52" y="500.95" font-size="13" class="dg-f-ink dg-text">Lopez</text><text x="26" y="519.8" font-size="13" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="52" y="519.8" font-size="13" class="dg-f-ink dg-text">Lillard</text><text x="26" y="538.65" font-size="13" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="52" y="538.65" font-size="13" class="dg-f-ink dg-text">Middleton</text><text x="26" y="557.5" font-size="13" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="52" y="557.5" font-size="13" class="dg-f-ink dg-text">Antetokounmpo</text><text x="26" y="576.35" font-size="13" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="52" y="576.35" font-size="13" class="dg-f-ink dg-text">Beasley</text><text x="180" y="482.95" font-size="12" class="dg-f-ink2 dg-text">IND (away)</text><text x="182" y="500.95" font-size="13" class="dg-f-c8 dg-text" font-weight="700">−1</text><text x="208" y="500.95" font-size="13" class="dg-f-ink dg-text">Haliburton</text><text x="182" y="519.8" font-size="13" class="dg-f-c8 dg-text" font-weight="700">−1</text><text x="208" y="519.8" font-size="13" class="dg-f-ink dg-text">Mathurin</text><text x="182" y="538.65" font-size="13" class="dg-f-c8 dg-text" font-weight="700">−1</text><text x="208" y="538.65" font-size="13" class="dg-f-ink dg-text">McConnell</text><text x="182" y="557.5" font-size="13" class="dg-f-c8 dg-text" font-weight="700">−1</text><text x="208" y="557.5" font-size="13" class="dg-f-ink dg-text">Toppin</text><text x="182" y="576.35" font-size="13" class="dg-f-c8 dg-text" font-weight="700">−1</text><text x="208" y="576.35" font-size="13" class="dg-f-ink dg-text">Turner</text><text x="26" y="603" font-size="13" class="dg-f-ink dg-text" font-weight="700">1</text><text x="52" y="603" font-size="13" class="dg-f-ink2 dg-text">intercept: home-court advantage</text><text x="24" y="629" font-size="13" class="dg-f-ink dg-text">Outcome: MIL 14, IND 25 over 15.7</text><text x="24" y="646.55" font-size="13" class="dg-f-ink dg-text">possessions = −69.9 per 100</text><text x="24" y="665.4" font-size="13" class="dg-f-ink2 dg-text">Weight: 15.7 possessions</text><text x="24" y="687.5" font-size="12" class="dg-f-c3 dg-text" font-style="italic">Opponents: on the same row, so every player is</text><text x="24" y="703.7" font-size="12" class="dg-f-c3 dg-text" font-style="italic">adjusted for the other nine</text><text x="12" y="755.7" font-size="13" class="dg-f-ink2 dg-text">Both models stack their rows and fit a</text><text x="12" y="773.25" font-size="13" class="dg-f-ink2 dg-text">possession-weighted ridge regression, with the</text><text x="12" y="790.8" font-size="13" class="dg-f-ink2 dg-text">penalty chosen by cross-validation. Each</text><text x="12" y="808.35" font-size="13" class="dg-f-ink2 dg-text">player&#x27;s coefficient is his net points per 100</text><text x="12" y="825.9" font-size="13" class="dg-f-ink2 dg-text">possessions with the other players on the</text><text x="12" y="843.45" font-size="13" class="dg-f-ink2 dg-text">floor accounted for.</text><text x="12" y="865.55" font-size="12" class="dg-f-ink3 dg-text">Rows in 2023-24: 15,484 lineups; 32,268 stints,</text><text x="12" y="881.75" font-size="12" class="dg-f-ink3 dg-text">after slivers such as a lineup on the floor for</text><text x="12" y="897.95" font-size="12" class="dg-f-ink3 dg-text">one free throw were merged into the next stint</text><text x="12" y="914.15" font-size="12" class="dg-f-ink3 dg-text">(62,658 parsed).</text></svg>
