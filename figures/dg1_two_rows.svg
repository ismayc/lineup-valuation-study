<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 542.95" role="img" aria-label="How each model turns basketball into one row of a regression"><title>How each model turns basketball into one row of a regression</title><defs><marker id="dg-arrow-9ed39d4d6d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><rect x="12" y="14" width="362" height="400.05" rx="8" stroke-width="1.5" class="dg-f-surface2 dg-s-rule"/><rect x="386" y="14" width="362" height="400.05" rx="8" stroke-width="1.5" class="dg-f-surface2 dg-s-rule"/><text x="24" y="42" font-size="18" class="dg-f-nba dg-display" font-weight="700">Lineup model</text><text x="24" y="64" font-size="14" class="dg-f-ink2 dg-text">One row per five-man lineup, summed over</text><text x="24" y="82.9" font-size="14" class="dg-f-ink2 dg-text">the season</text><text x="24" y="112.9" font-size="15" class="dg-f-ink dg-text" font-weight="700">MIL&#x27;s best high-volume lineup</text><text x="26" y="136.9" font-size="15" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="58" y="136.9" font-size="15" class="dg-f-ink dg-text">Brook Lopez</text><text x="26" y="158.65" font-size="15" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="58" y="158.65" font-size="15" class="dg-f-ink dg-text">Damian Lillard</text><text x="26" y="180.4" font-size="15" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="58" y="180.4" font-size="15" class="dg-f-ink dg-text">Khris Middleton</text><text x="26" y="202.15" font-size="15" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="58" y="202.15" font-size="15" class="dg-f-ink dg-text">Giannis Antetokounmpo</text><text x="26" y="223.9" font-size="15" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="58" y="223.9" font-size="15" class="dg-f-ink dg-text">Malik Beasley</text><text x="26" y="245.65" font-size="15" class="dg-f-ink3 dg-text" font-weight="700">0</text><text x="58" y="245.65" font-size="15" class="dg-f-ink3 dg-text">every other player</text><text x="24" y="275.65" font-size="15" class="dg-f-ink dg-text">Outcome: +199 over 1,302 possessions =</text><text x="24" y="295.9" font-size="15" class="dg-f-ink dg-text">+15.3 per 100</text><text x="24" y="317.65" font-size="15" class="dg-f-ink2 dg-text">Weight: 1,302 possessions</text><text x="24" y="343.15" font-size="14" class="dg-f-c8 dg-text" font-style="italic">Opponents: not in the season totals, so not</text><text x="24" y="362.05" font-size="14" class="dg-f-c8 dg-text" font-style="italic">adjusted for</text><text x="398" y="42" font-size="18" class="dg-f-nba dg-display" font-weight="700">Stint model</text><text x="398" y="64" font-size="14" class="dg-f-ink2 dg-text">One row per stint: no substitution by</text><text x="398" y="82.9" font-size="14" class="dg-f-ink2 dg-text">either team</text><text x="398" y="112.9" font-size="15" class="dg-f-ink dg-text" font-weight="700">IND at MIL, fourth quarter, 7:33 to 0:00</text><text x="398" y="136.9" font-size="14" class="dg-f-ink2 dg-text">MIL (home)</text><text x="400" y="157.9" font-size="15" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="426" y="157.9" font-size="15" class="dg-f-ink dg-text">Lopez</text><text x="400" y="179.65" font-size="15" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="426" y="179.65" font-size="15" class="dg-f-ink dg-text">Lillard</text><text x="400" y="201.4" font-size="15" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="426" y="201.4" font-size="15" class="dg-f-ink dg-text">Middleton</text><text x="400" y="223.15" font-size="15" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="426" y="223.15" font-size="15" class="dg-f-ink dg-text">Antetokounmpo</text><text x="400" y="244.9" font-size="15" class="dg-f-nba dg-text" font-weight="700">+1</text><text x="426" y="244.9" font-size="15" class="dg-f-ink dg-text">Beasley</text><text x="567" y="136.9" font-size="14" class="dg-f-ink2 dg-text">IND (away)</text><text x="569" y="157.9" font-size="15" class="dg-f-c8 dg-text" font-weight="700">−1</text><text x="595" y="157.9" font-size="15" class="dg-f-ink dg-text">Haliburton</text><text x="569" y="179.65" font-size="15" class="dg-f-c8 dg-text" font-weight="700">−1</text><text x="595" y="179.65" font-size="15" class="dg-f-ink dg-text">Mathurin</text><text x="569" y="201.4" font-size="15" class="dg-f-c8 dg-text" font-weight="700">−1</text><text x="595" y="201.4" font-size="15" class="dg-f-ink dg-text">McConnell</text><text x="569" y="223.15" font-size="15" class="dg-f-c8 dg-text" font-weight="700">−1</text><text x="595" y="223.15" font-size="15" class="dg-f-ink dg-text">Toppin</text><text x="569" y="244.9" font-size="15" class="dg-f-c8 dg-text" font-weight="700">−1</text><text x="595" y="244.9" font-size="15" class="dg-f-ink dg-text">Turner</text><text x="400" y="275.65" font-size="15" class="dg-f-ink dg-text" font-weight="700">1</text><text x="426" y="275.65" font-size="15" class="dg-f-ink2 dg-text">intercept: home-court advantage</text><text x="398" y="305.65" font-size="15" class="dg-f-ink dg-text">Outcome: MIL 14, IND 25 over 15.7</text><text x="398" y="325.9" font-size="15" class="dg-f-ink dg-text">possessions = −69.9 per 100</text><text x="398" y="347.65" font-size="15" class="dg-f-ink2 dg-text">Weight: 15.7 possessions</text><text x="398" y="373.15" font-size="14" class="dg-f-c3 dg-text" font-style="italic">Opponents: on the same row, so every player</text><text x="398" y="392.05" font-size="14" class="dg-f-c3 dg-text" font-style="italic">is adjusted for the other nine</text><text x="12" y="444.05" font-size="15" class="dg-f-ink2 dg-text">Both models stack their rows and fit a possession-weighted ridge regression, with the</text><text x="12" y="464.3" font-size="15" class="dg-f-ink2 dg-text">penalty chosen by cross-validation. Each player&#x27;s coefficient is his net points per 100</text><text x="12" y="484.55" font-size="15" class="dg-f-ink2 dg-text">possessions with the other players on the floor accounted for.</text><text x="12" y="510.05" font-size="14" class="dg-f-ink3 dg-text">Rows in 2023-24: 15,484 lineups; 32,268 stints, after slivers such as a lineup on the floor for</text><text x="12" y="528.95" font-size="14" class="dg-f-ink3 dg-text">one free throw were merged into the next stint (62,658 parsed).</text></svg>
