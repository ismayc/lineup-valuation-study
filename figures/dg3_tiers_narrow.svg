<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 617.25" role="img" aria-label="What one season&#x27;s intervals can and cannot separate"><title>What one season&#x27;s intervals can and cannot separate</title><defs><marker id="dg-arrow-eea01b37d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="28" font-size="17" class="dg-f-ink dg-display" font-weight="600">1. Three tiers</text><text x="12" y="48" font-size="12" class="dg-f-ink2 dg-text">All 454 players with 300+ possessions in 2023-24,</text><text x="12" y="64.2" font-size="12" class="dg-f-ink2 dg-text">sorted by where their 95% interval sits against</text><text x="12" y="80.4" font-size="12" class="dg-f-ink2 dg-text">zero (league average)</text><rect x="12" y="98.4" width="29.6035" height="34" class="dg-f-nba" opacity="0.9"/><rect x="41.6035" y="98.4" width="287.154" height="34" class="dg-f-ink3" opacity="0.35"/><rect x="328.758" y="98.4" width="19.2423" height="34" class="dg-f-c8" opacity="0.75"/><rect x="12" y="98.4" width="336" height="34" class="dg-f-none dg-s-rule" stroke-width="1"/><rect x="12" y="145.4" width="12" height="12" class="dg-f-nba" rx="2" opacity="0.9"/><text x="30" y="156.4" font-size="13" class="dg-f-ink dg-text" font-weight="700">40</text><text x="66" y="156.4" font-size="13" class="dg-f-ink2 dg-text">clearly above average</text><rect x="12" y="166.2" width="12" height="12" class="dg-f-ink3" rx="2" opacity="0.35"/><text x="30" y="177.2" font-size="13" class="dg-f-ink dg-text" font-weight="700">388</text><text x="66" y="177.2" font-size="13" class="dg-f-ink2 dg-text">cannot tell from average</text><rect x="12" y="187" width="12" height="12" class="dg-f-c8" rx="2" opacity="0.75"/><text x="30" y="198" font-size="13" class="dg-f-ink dg-text" font-weight="700">26</text><text x="66" y="198" font-size="13" class="dg-f-ink2 dg-text">clearly below average</text><text x="12" y="248.8" font-size="17" class="dg-f-ink dg-display" font-weight="600">2. Ranks the 5th-ranked player</text><text x="12" y="271.75" font-size="17" class="dg-f-ink dg-display" font-weight="600">cannot be separated from</text><text x="12" y="291.75" font-size="12" class="dg-f-ink2 dg-text">Each dot is one of the top 70 players&#x27; estimates.</text><text x="12" y="307.95" font-size="12" class="dg-f-ink2 dg-text">The band is Shai Gilgeous-Alexander&#x27;s 95% interval</text><text x="12" y="324.15" font-size="12" class="dg-f-ink2 dg-text">(+2.2 to +7.3 per 100).</text><rect x="40" y="349.107" width="308" height="84.2453" class="dg-f-nba" opacity="0.14"/><line x1="40" y1="469.193" x2="348" y2="469.193" stroke-width="1" class="dg-s-rule"/><text x="36" y="474.193" font-size="12" class="dg-f-ink3 dg-text" text-anchor="end">0</text><line x1="40" y1="349.107" x2="348" y2="349.107" stroke-width="1" class="dg-s-nba" stroke-dasharray="4 3"/><line x1="40" y1="433.352" x2="348" y2="433.352" stroke-width="1" class="dg-s-nba" stroke-dasharray="4 3"/><circle cx="46" cy="377.846" r="2.6" class="dg-f-nba"/><circle cx="50.2899" cy="382.08" r="2.6" class="dg-f-nba"/><circle cx="54.5797" cy="387.574" r="2.6" class="dg-f-nba"/><circle cx="58.8696" cy="389.296" r="2.6" class="dg-f-nba"/><circle cx="63.1594" cy="389.843" r="2.6" class="dg-f-nba"/><circle cx="67.4493" cy="399.867" r="2.6" class="dg-f-nba"/><circle cx="71.7391" cy="401.97" r="2.6" class="dg-f-nba"/><circle cx="76.029" cy="406.874" r="2.6" class="dg-f-nba"/><circle cx="80.3188" cy="406.88" r="2.6" class="dg-f-nba"/><circle cx="84.6087" cy="407.1" r="2.6" class="dg-f-nba"/><circle cx="88.8986" cy="407.878" r="2.6" class="dg-f-nba"/><circle cx="93.1884" cy="407.997" r="2.6" class="dg-f-nba"/><circle cx="97.4783" cy="408.922" r="2.6" class="dg-f-nba"/><circle cx="101.768" cy="409.116" r="2.6" class="dg-f-nba"/><circle cx="106.058" cy="409.325" r="2.6" class="dg-f-nba"/><circle cx="110.348" cy="409.491" r="2.6