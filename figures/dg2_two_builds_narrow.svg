<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 992.7" role="img" aria-label="Two independent builds of player value and where they meet"><title>Two independent builds of player value and where they meet</title><defs><marker id="dg-arrow-a869b9402c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="26" font-size="17" class="dg-f-nba dg-display" font-weight="700">Lineup model</text><rect x="12" y="42" width="336" height="65.1" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="24" y="62" font-size="12" class="dg-f-ink3 dg-text" font-weight="700">SOURCE</text><text x="24" y="80.2" font-size="13" class="dg-f-ink dg-text">the NBA&#x27;s season lineup totals</text><text x="24" y="97.75" font-size="13" class="dg-f-ink dg-text">(stats.nba.com)</text><line x1="180" y1="109.1" x2="180" y2="123.1" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-a869b9402c)"/><rect x="12" y="125.1" width="336" height="47.55" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="24" y="145.1" font-size="12" class="dg-f-ink3 dg-text" font-weight="700">UNIT</text><text x="24" y="163.3" font-size="13" class="dg-f-ink dg-text">15,901 five-man lineups</text><line x1="180" y1="174.65" x2="180" y2="188.65" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-a869b9402c)"/><rect x="12" y="190.65" width="336" height="65.1" class="dg-f-surface2 dg-s-c3" rx="6" stroke-width="1.5"/><text x="24" y="210.65" font-size="12" class="dg-f-c3 dg-text" font-weight="700">AUDIT</text><text x="24" y="228.85" font-size="13" class="dg-f-ink dg-text">lineup plus-minus re-adds to every team&#x27;s</text><text x="24" y="246.4" font-size="13" class="dg-f-ink dg-text">season total (largest miss: 0 points)</text><line x1="180" y1="257.75" x2="180" y2="271.75" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-a869b9402c)"/><rect x="12" y="273.75" width="336" height="47.55" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="24" y="293.75" font-size="12" class="dg-f-ink3 dg-text" font-weight="700">MODEL</text><text x="24" y="311.95" font-size="13" class="dg-f-ink dg-text">ridge on each lineup&#x27;s five players</text><line x1="180" y1="323.3" x2="180" y2="337.3" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-a869b9402c)"/><rect x="12" y="339.3" width="336" height="47.55" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="24" y="359.3" font-size="12" class="dg-f-ink3 dg-text" font-weight="700">RESULT</text><text x="24" y="377.5" font-size="13" class="dg-f-ink dg-text" font-weight="700">454 player values</text><text x="12" y="426.85" font-size="17" class="dg-f-nba dg-display" font-weight="700">Stint model</text><rect x="12" y="442.85" width="336" height="47.55" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="24" y="462.85" font-size="12" class="dg-f-ink3 dg-text" font-weight="700">SOURCE</text><text x="24" y="481.05" font-size="13" class="dg-f-ink dg-text">the season&#x27;s play-by-play, event by event</text><line x1="180" y1="492.4" x2="180" y2="506.4" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-a869b9402c)"/><rect x="12" y="508.4" width="336" height="47.55" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="24" y="528.4" font-size="12" class="dg-f-ink3 dg-text" font-weight="700">UNIT</text><text x="24" y="546.6" font-size="13" class="dg-f-ink dg-text">62,658 stints from 1,230 games</text><line x1="180" y1="557.95" x2="180" y2="571.95" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-a869b9402c)"/><rect x="12" y="573.95" width="336" height="65.1" class="dg-f-surface2 dg-s-c3" rx="6" stroke-width="1.5"/><text x="24" y="593.95" font-size="12" class="dg-f-c3 dg-text" font-weight="700">AUDIT</text><text x="24" y="612.15" font-size="13" class="dg-f-ink dg-text">plus-minus matches the NBA&#x27;s own feed in</text><text x="24" y="629.7" font-size="13" class="dg-f-ink dg-text">99.8% of player-games</text><line x1="180" y1="641.05" x2="180" y2="655.05" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-a869b9402c)"/><rect x="12" y="657.05" width="336" height="47.55" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="24" y="677.05" font-size="12" class="dg-f-ink3 dg-text" font-weight="700">MODEL</text><text x="24" y="695.25" font-size="13" class="dg-f-ink dg-text">ridge on both fives, with opponents</text><line x1="180" y1="706.6" x2="180" y2="720.6" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-a869b9402c)"/><rect x="12" y="722.6" width="336" height="65.1" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><text x="24" y="742.6" font-size="12" class="dg-f-ink3 dg-text" font-weight="700">RESULT</text><text x="24" y="760.8" font-size="13" class="dg-f-ink dg-text" font-weight="700">452 player values, and home court worth</text><text x="24" y="778.35" font-size="13" class="dg-f-ink dg-text" font-weight="700">+2.2 per 100 as a byproduct</text><line x1="180" y1="789.7" x2="180" y2="823.7" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-a869b9402c)"/><rect x="12" y="827.7" width="336" height="88.6" class="dg-f-surface2 dg-s-nba" rx="8" stroke-width="2"/><text x="26" y="851.7" font-size="12" class="dg-f-nba dg-text" font-weight="700">WHERE THEY MEET</text><text x="26" y="870.55" font-size="13" class="dg-f-ink dg-text">452 players are in both. Ranked by each</text><text x="26" y="888.1" font-size="13" class="dg-f-ink dg-text">model, their orders agree with a Spearman</text><text x="26" y="905.65" font-size="13" class="dg-f-ink dg-text">correlation of 0.97.</text><text x="12" y="946.3" font-size="12" class="dg-f-ink2 dg-text">No code path and no data feed is shared between</text><text x="12" y="962.5" font-size="12" class="dg-f-ink2 dg-text">the two columns, so their agreement is evidence</text><text x="12" y="978.7" font-size="12" class="dg-f-ink2 dg-text">about the players, not the plumbing.</text></svg>
