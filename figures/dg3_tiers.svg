<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 516.05" role="img" aria-label="What one season&#x27;s intervals can and cannot separate"><title>What one season&#x27;s intervals can and cannot separate</title><defs><marker id="dg-arrow-336a22105c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="28" font-size="18" class="dg-f-ink dg-display" font-weight="600">1. Three tiers</text><text x="12" y="48" font-size="14" class="dg-f-ink2 dg-text">All 454 players with 300+ possessions in 2023-24, sorted by where their 95% interval sits</text><text x="12" y="66.9" font-size="14" class="dg-f-ink2 dg-text">against zero (league average)</text><rect x="12" y="84.9" width="64.8458" height="34" class="dg-f-nba" opacity="0.9"/><rect x="76.8458" y="84.9" width="629.004" height="34" class="dg-f-ink3" opacity="0.35"/><rect x="705.85" y="84.9" width="42.1498" height="34" class="dg-f-c8" opacity="0.75"/><rect x="12" y="84.9" width="736" height="34" class="dg-f-none dg-s-rule" stroke-width="1"/><text x="12" y="142.9" font-size="15" class="dg-f-nba dg-text" font-weight="700">40 clearly above average</text><text x="380" y="142.9" font-size="15" class="dg-f-ink dg-text" text-anchor="middle" font-weight="700">388 cannot tell from average</text><text x="748" y="142.9" font-size="15" class="dg-f-c8 dg-text" text-anchor="end" font-weight="700">26 clearly below average</text><text x="12" y="196.9" font-size="18" class="dg-f-ink dg-display" font-weight="600">2. Ranks the 5th-ranked player cannot be separated from</text><text x="12" y="216.9" font-size="14" class="dg-f-ink2 dg-text">Each dot is one of the top 70 players&#x27; estimates. The band is Shai Gilgeous-Alexander&#x27;s 95%</text><text x="12" y="235.8" font-size="14" class="dg-f-ink2 dg-text">interval (+2.2 to +7.3 per 100).</text><rect x="46" y="261.52" width="702" height="97.2061" class="dg